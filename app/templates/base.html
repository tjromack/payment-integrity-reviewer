<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           color: #1a2330; background: #f7f9fc; }
    header { background: #fff; border-bottom: 1px solid #e3e8ef; padding: 16px 28px; }
    header h1 { margin: 0; font-size: 18px; }
    header .tag { color: #5b6b80; font-size: 13px; margin-top: 2px; }
    main { max-width: 980px; margin: 0 auto; padding: 28px; }
    .card { background: #fff; border: 1px solid #e3e8ef; border-radius: 10px; padding: 20px 22px; }
    .muted { color: #5b6b80; }
    a { color: #1f6feb; }
    code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>{{ title }}</h1>
    <div class="tag">{{ tagline }}</div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
